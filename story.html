    <template id="story-title-1">শেষের কবিতা</template>
    <template id="story-1">
— অমিত ও লাবণ্যের পরিচয় অমিত রায় বিলেতফেরত এক তরুণ ব্যারিস্টার। সে বুদ্ধিমান, আত্মবিশ্বাসী এবং কথায় কথায় যুক্তি ও রসিকতা করতে ভালোবাসে। প্রচলিত নিয়মকানুনকে সে খুব একটা গুরুত্ব দেয় না।
একবার শিলং পাহাড়ে বেড়াতে গিয়ে অমিতের গাড়ির সঙ্গে একটি দুর্ঘটনা ঘটে। সেই ঘটনাই তার জীবনে নিয়ে আসে লাবণ্যকে।
লাবণ্য শান্ত, শিক্ষিত এবং গভীরভাবে চিন্তা করতে পারে এমন এক তরুণী। অমিতের চঞ্চল ও তর্কপ্রিয় স্বভাবের সঙ্গে তার স্বভাবের অনেক পার্থক্য। প্রথম পরিচয়েই দুজনের মধ্যে শুরু হয় কথার লড়াই—কখনো যুক্তি, কখনো রসিকতা, আবার কখনো একে অপরকে বুঝে নেওয়ার চেষ্টা।
কিন্তু এই কথোপকথনের মধ্যেই ধীরে ধীরে তাদের মধ্যে এক অদ্ভুত আকর্ষণ তৈরি হয়।
অমিত বুঝতে পারে, লাবণ্য অন্যদের মতো নয়। তাকে শুধু বাহ্যিক সৌন্দর্য দিয়ে বোঝা যায় না; তার চিন্তা, আত্মসম্মান এবং কথার গভীরতা অমিতকে মুগ্ধ করে।
লাবণ্যও বুঝতে পারে, অমিত শুধু একজন অহংকারী তরুণ নয়। তার হাসি-ঠাট্টার আড়ালে আছে গভীর অনুভূতি এবং নিজের মতো করে জীবনকে দেখার একটি শক্তিশালী মানসিকতা।
তাদের পরিচয় ক্রমে বন্ধুত্বে পরিণত হয়। তারপর সেই বন্ধুত্বের মধ্যেই জন্ম নেয় প্রেম।কিন্তু এই প্রেম সহজ পথে এগোয় না।
অমিতের অতীত, কেতকীর সঙ্গে তার পুরোনো সম্পর্ক এবং লাবণ্যের নিজের জীবনবোধ—সবকিছু মিলিয়ে তাদের সামনে এমন এক সিদ্ধান্ত আসতে থাকে, যেখানে শুধু ভালোবাসা থাকলেই সম্পর্ককে পরিণতি দেওয়া সম্ভব নয়।
অমিত ও লাবণ্যের সম্পর্কের সবচেয়ে বড় সৌন্দর্য এখানেই—তারা একে অপরকে শুধু ভালোবাসে না, একে অপরের চিন্তাকেও সম্মান করে।
আর সেই কারণেই তাদের প্রেম ধীরে ধীরে সাধারণ প্রেমের গল্পের চেয়ে অনেক গভীর হয়ে ওঠে।
এখান থেকেই শুরু হয় অমিত ও লাবণ্যের সেই স্মরণীয় প্রেমের কাহিনি।শেষের কবিতা
অমিত আর লাবণ্যের সম্পর্ক যত গভীর হতে থাকে, ততই দুজন বুঝতে পারে—তাদের ভালোবাসা শুধু আবেগের বিষয় নয়। দুজনের ব্যক্তিত্ব, জীবনবোধ আর ভবিষ্যৎ নিয়ে ভাবনার মধ্যেও বড় পার্থক্য রয়েছে।
অমিত চায় লাবণ্যকে নিজের জীবনের স্থায়ী সঙ্গী করতে। কিন্তু লাবণ্য জানে, যে মানুষকে ভালোবাসা যায়, তার সঙ্গে সংসার করা সবসময় একই ব্যাপার নয়।
তবুও শেষ পর্যন্ত তাদের বিয়ের কথা ঠিক হয়।
ঠিক সেই সময় শিলংয়ে আসে কেতকী। অমিতের অতীতের সঙ্গে কেতকীর সম্পর্ক ছিল। বিলেতে থাকার সময় অমিত কেতকীর প্রতি গভীরভাবে আকৃষ্ট হয়েছিল এবং তাদের সম্পর্কের একটি পুরোনো স্মৃতিও ছিল—একটি আংটি।
কেতকীর আগমনে পরিস্থিতি বদলে যায়।
লাবণ্য জানতে পারে অমিতের অতীতের কথা। সে বুঝতে পারে, অমিতের জীবনে শুধু তার উপস্থিতিই নেই; পুরোনো সম্পর্কেরও একটা অসমাপ্ত অধ্যায় রয়েছে।অমিত দ্বিধায় পড়ে যায়।
লাবণ্য তখন এমন সিদ্ধান্ত নেয়, যা অমিতকে আরও বেশি কষ্ট দেয়। সে বুঝতে পারে, ভালোবাসাকে জোর করে সংসারের নিয়মে বেঁধে ফেললে হয়তো তাদের সেই সুন্দর সম্পর্কটাই নষ্ট হয়ে যাবে।
শেষ পর্যন্ত লাবণ্য শিলং ছেড়ে চলে যায়।
অমিত তাকে খুঁজতে চাইলেও লাবণ্যের কোনো ঠিকানা পায় না।
সময়ের সঙ্গে অমিতের জীবন অন্যদিকে এগিয়ে যায়। কেতকীর সঙ্গে তার বিয়ে হয়।
অন্যদিকে লাবণ্যের জীবনেও ফিরে আসে শোভনলাল—যে একসময় লাবণ্যকে ভালোবাসত। অতীতের সেই সম্পর্ক নতুন অর্থ পেতে শুরু করে।
কিছুদিন পর অমিতের কাছে লাবণ্যের একটি চিঠি আসে।
চিঠিতে লাবণ্য জানায়, তার বিয়ে শোভনলালের সঙ্গে ঠিক হয়েছে।
অমিত চিঠিটা পড়ে অনেকক্ষণ নীরব থাকে।
সে বুঝতে পারে, তাদের প্রেমের মৃত্যু হয়নি—শুধু তার রূপ বদলে গেছে।
তারা একে অপরকে হারিয়েছে, কিন্তু একে অপরের জীবনে রেখে গেছে এমন কিছু স্মৃতি, যা কোনো সম্পর্কের দৈনন্দিন হিসাব দিয়ে মাপা যায় না।
লাবণ্যও জানে, অমিতকে সে জীবনের প্রতিদিনের সঙ্গী হিসেবে পায়নি। কিন্তু তার হৃদয়ে অমিতের জন্য যে ভালোবাসা তৈরি হয়েছিল, সেটাকে সে মুছে ফেলতে চায় না।তাই বিদায়ের মধ্যেও থাকে কৃতজ্ঞতা।
তাদের প্রেম সংসারে পরিণত হয়নি, কিন্তু সেই প্রেম তাদের দুজনকেই বদলে দিয়েছে।
অমিত তার নতুন জীবনে এগিয়ে যায়।
লাবণ্যও নিজের নতুন জীবনের দিকে পা বাড়ায়।
তবু তাদের দুজনের মনে থেকে যায় সেই পাহাড়ি দিনের পরিচয়, তর্ক, হাসি, অভিমান আর ভালোবাসা।
কখনো কখনো ভালোবাসার সবচেয়ে বড় প্রমাণ হলো কাউকে নিজের করে পাওয়া নয়—তার ভালো থাকাকে মেনে নিয়ে নিজের পথেও এগিয়ে যাওয়া।
এইভাবেই অমিত ও লাবণ্যের প্রেমের গল্প পূর্ণতা পায়—মিলনের মাধ্যমে নয়, এক গভীর বিদায়ের মাধ্যমে।

—কী প্রতিশ্রুতি?

আরিশ উত্তর দিল না।

বরং পকেট থেকে একটা ছোট্ট বাক্স বের করল।

নীহারিকার চোখ আটকে গেল বাক্সটার দিকে।

—এটা কী?

আরিশ বলল,

—এক বছর আগে তোমাকে একটা কথা বলার জন্য চলে গিয়েছিলাম। আজ সেটা বলার সময় হয়েছে।

নীহারিকার বুক ধড়ফড় করতে লাগল।

আরিশ বাক্সটা তার হাতে দিয়ে বলল,

—এটা খুলবে না এখন।

—কেন?

—কারণ আগে তোমাকে একটা সত্যি বলতে হবে।

নীহারিকা চুপ করে রইল।

আরিশ ধীরে বলল,

—আমি তোমার কাছ থেকে দূরে ছিলাম, কিন্তু তোমাকে ভুলে যাইনি। বরং প্রতিদিন তোমার কাছে ফিরে আসার একটা কারণ খুঁজেছি।

—তাহলে সত্যিটা কী?

আরিশ তার দিকে তাকিয়ে বলল,

—আমি তোমার জীবন থেকে হারিয়ে যাইনি, নীহা। আমি ইচ্ছে করেই নিজেকে সরিয়ে নিয়েছিলাম।

নীহারিকার চোখে প্রশ্ন।

—কেন?

আরিশ নিচু গলায় বলল,

—কারণ তখন আমি তোমাকে ভালোবাসতাম। কিন্তু আমার মনে হয়েছিল, তোমাকে ভালোবাসার অধিকার আমার নেই।

নীহারিকা কিছু বলার আগেই আরিশ সেখান থেকে চলে গেল।

তার হাতে রয়ে গেল শুধু ছোট্ট বাক্সটা।

নীহারিকা বাক্সটা খুলল।

ভেতরে ছিল একটি পুরোনো ছবি।

ছবির পেছনে লেখা—

“তুমি যেদিন এটা পড়বে, সেদিন হয়তো বুঝবে কেন তোমার অপেক্ষায় আমিও ছিলাম।”

নীহারিকা ছবিটা হাতে নিয়ে স্থির হয়ে দাঁড়িয়ে রইল।

কারণ ছবিটা ছিল—

তার নিজের।

আর ছবিটা তোলা হয়েছিল সেই দিন, যেদিন আরিশ প্রথমবার তাকে দেখেছিল।

কিন্তু নীহারিকা জানতই না—

আরিশ তাকে তার ধারণার চেয়েও অনেক আগে থেকে ভালোবাসত।


**🍂ashraful🍂**

এই যে, বুড়া বেডা! একটু দাঁড়ান তো!

ছেলেটা থেমে পেছনে তাকাল।

—আমাকে বলছেন?

—আপনি ছাড়া এখানে আর কোনো বুড়া বেডা দেখছেন?

ছেলেটা হেসে বলল,

—আমার নাম আরমান। আর আমাকে বুড়া বেডা ডাকছেন কেন?

মেয়েটা বলল,

—কারণ আপনাকে দেখলেই আমার এই নামটাই মনে আসে।

—বেশ। তাহলে আপনার নাম কী?

—আমার নাম জানার দরকার নেই।

—তাহলে আপনাকে কী বলে ডাকব?

মেয়েটা একটু ভেবে বলল,

—বুড়া বেডি।

আরমান হেসে ফেলল।

—ঠিক আছে। আজ থেকে আপনি বুড়া বেডি, আমি বুড়া বেডা।

মেয়েটা হাত বাড়িয়ে বলল,

—চুক্তি?

আরমান হাত মিলিয়ে বলল,

—চুক্তি।

সেদিনের সেই অদ্ভুত চুক্তিটা যে একদিন তাদের জীবনের সবচেয়ে সুন্দর সম্পর্কের শুরু হবে, সেটা দুজনের কেউই জানত না।

পরদিন থেকেই শুরু হলো তাদের খুনসুটি।

বুড়া বেডি বলত,

—বুড়া বেডা, এত দেরি করেন কেন?

আরমান বলত,

—আপনি কি আমার জন্য অপেক্ষা করেন?

—একদম না।

—তাহলে সময়ের হিসাব রাখেন কেন?

—কারণ আপনি বিরক্তিকর।

—তবুও অপেক্ষা করেন?

বুড়া বেডি মুখ ঘুরিয়ে বলত,

—চুপ করুন।

কয়েকদিন পর আরমান একদিন ইচ্ছে করেই তার সঙ্গে কথা বলল না।

সারাদিন কোনো মেসেজ নেই।

রাতের দিকে বুড়া বেডির ফোনে একটা মেসেজ এল—

“আজ এত চুপ কেন?”

আরমান উত্তর দিল—

“আপনি তো বলেছিলেন আমি বেশি কথা বলি।”

কিছুক্ষণ পর উত্তর এল—

“বেশি কথা বলা আর একদম কথা না বলা এক জিনিস নয়।”

আরমান মেসেজটা পড়ে হাসল।

তারপর লিখল—

“তাহলে আমাকে কতটা কথা বলতে দেবেন?”

ওপাশ থেকে উত্তর এল—

“যতক্ষণ না আপনার কথা শুনতে আমার ভালো লাগে।”

আরমান কিছুক্ষণ স্ক্রিনের দিকে তাকিয়ে রইল।

তারপর লিখল—

“তাহলে মনে হয় আমি বিপদে পড়েছি।”

বুড়া বেডি জিজ্ঞেস করল—

“কেন?”

আরমান লিখল—

“কারণ আপনার সঙ্গে কথা বলতে আমার ইতিমধ্যেই ভালো লাগতে শুরু করেছে।”

সেদিন প্রথমবার বুড়া বেডি কোনো উত্তর দিল না।

শুধু ফোনটা হাতে নিয়ে চুপচাপ বসে রইল।

আর তার মুখের অজান্তে ফুটে উঠল একটুখানি হাসি।

তাদের গল্পটা সেদিন থেকেই বন্ধুত্বের সীমা ছাড়িয়ে অন্য এক অনুভূতির দিকে হাঁটতে শুরু করল।
পরদিন সকাল থেকেই বুড়া বেডি বারবার ফোনটা দেখছিল।

কোনো মেসেজ নেই।

সে নিজেকে বোঝাল, মেসেজ না দিলেই বা কী?

কিন্তু কিছুক্ষণ পর নিজেই লিখে ফেলল—

“বুড়া বেডা, ঘুম থেকে উঠেছেন?”

সঙ্গে সঙ্গে উত্তর এল—

“আপনি মেসেজ না দিলে আরও কিছুক্ষণ ঘুমাতাম।”

বুড়া বেডি লিখল—

“আমি কি আপনাকে উঠতে বলেছি?”

—“না।”

—“তাহলে?”

—“আপনার মেসেজ দেখেই ঘুম চলে গেছে।”

—“বেশি নাটক করবেন না।”

—“আপনি কথা বললেই আমার নাটক করতে ইচ্ছে করে।”

বুড়া বেডি ফোনের দিকে তাকিয়ে হেসে ফেলল।

দিনের পর দিন এভাবেই তাদের কথা বাড়তে লাগল।

কখনো সামান্য বিষয় নিয়ে ঝগড়া, কখনো একে অপরকে নিয়ে মজা, আবার কখনো কোনো কারণ ছাড়াই ঘণ্টার পর ঘণ্টা কথা।

একদিন রাতে বুড়া বেডি হঠাৎ বলল,

—বুড়া বেডা?

—হুম?

—আপনি কি আমাকে সত্যিই পছন্দ করেন?

আরমান কিছুক্ষণ চুপ করে রইল।

—হঠাৎ এই প্রশ্ন কেন?

—এমনিই।

—সত্যি বলব?

—হুম।

আরমান ধীরে বলল,

—আপনাকে পছন্দ করি কি না জানি না। তবে আপনার সঙ্গে কথা না হলে দিনটা অসম্পূর্ণ লাগে।

বুড়া বেডি চুপ।

আরমান আবার বলল,

—আপনার মেসেজ না এলে ফোনটা বারবার দেখি। আপনি রাগ করলে আমার মন খারাপ হয়। আর আপনি হাসলে অকারণেই আমার ভালো লাগে।

কিছুক্ষণ পর বুড়া বেডি লিখল—

“এগুলো কি পছন্দ করার লক্ষণ?”

আরমান উত্তর দিল—

“সম্ভবত।”

—“তাহলে আপনি আমাকে পছন্দ করেন।”

—“হয়তো।”

—“হয়তো কেন?”

—“কারণ ‘ভালোবাসি’ কথাটা বলার আগে নিশ্চিত হতে চাই।”

বুড়া বেডি অনেকক্ষণ কোনো উত্তর দিল না।

তারপর শুধু লিখল—

“আমিও তাড়াহুড়ো করছি না।”

সেদিন রাতের কথোপকথন সেখানেই শেষ হয়েছিল।

কিন্তু দুজনের মনেই একটা নতুন প্রশ্ন জন্ম নিল—

তাদের এই অদ্ভুত বন্ধুত্ব কি একদিন সত্যিকারের ভালোবাসায় পরিণত হবে?

পরদিন হঠাৎ বুড়া বেডির ফোনে আরমানের কোনো মেসেজ এল না।

এক ঘণ্টা।

দুই ঘণ্টা।

পুরো দিন।

বুড়া বেডি যতই নিজেকে বোঝাক, ততই অস্থির হয়ে উঠল।

শেষ পর্যন্ত সে নিজেই লিখল—

“বুড়া বেডা, কোথায় আপনি?”

কোনো উত্তর এল না।

সেদিন প্রথমবার বুড়া বেডি বুঝতে পারল—

আরমান শুধু তার সঙ্গে কথা বলা একজন মানুষ নয়।

সে ধীরে ধীরে তার প্রতিদিনের অভ্যাস হয়ে গেছে।
সারাদিন আরমানের কোনো খবর না পেয়ে বুড়া বেডি শেষ পর্যন্ত ফোনটা এক পাশে রেখে দিল।

নিজেকে বলল,

—আমি কেন এত চিন্তা করছি? ও তো আমার কেউ না।

কথাটা বলেই বুকের ভেতরটা কেমন যেন খালি লাগল।

রাত হয়ে গেল।

ঠিক তখনই ফোনটা বেজে উঠল।

স্ক্রিনে নামটা দেখে বুড়া বেডির অভিমান আরও বেড়ে গেল।

বুড়া বেডা কল করছে।

সে প্রথমে ফোন ধরল না।

দ্বিতীয়বারও ধরল না।

তৃতীয়বার ফোন আসার পর বিরক্ত মুখে কলটা ধরল।

—কী চান?

ওপাশ থেকে আরমানের ক্লান্ত কণ্ঠ,

—রাগ করেছেন?

—না।

—আপনার “না” শুনেই বুঝতে পারছি, অনেক রাগ করেছেন।

—সারাদিন কোথায় ছিলেন?

কথাটা বেরিয়ে যাওয়ার পর বুড়া বেডি নিজেই চুপ হয়ে গেল।

আরমান মৃদু হেসে বলল,

—তাহলে চিন্তা করেছেন?

—একদম না।

—তাহলে এত জিজ্ঞেস করছেন কেন?

—কারণ... কারণ...

কথাটা শেষ করতে পারল না সে।

আরমান বলল,

—আজ আমার ফোনটা নষ্ট হয়ে গিয়েছিল। সারাদিন ঠিক করাতে ব্যস্ত ছিলাম।

বুড়া বেডি কিছুক্ষণ চুপ থেকে বলল,

—একটা ফোন ঠিক করতে এত সময় লাগে?

—আপনি কি সত্যিই এতক্ষণ আমার অপেক্ষায় ছিলেন?

—আপনার জন্য না।

—তাহলে?

—আমার অভ্যাসের জন্য।

আরমান হেসে বলল,

—আমি তাহলে আপনার অভ্যাস হয়ে গেছি?

বুড়া বেডি উত্তর দিল না।

আরমান আবার বলল,

গুরুচরণের বাড়ির পাশেই থাকত শেখরদের পরিবার। শেখর ছিল শিক্ষিত, স্বচ্ছল পরিবারের ছেলে। ছোটবেলা থেকেই ললিতার সঙ্গে তার পরিচয়।

ললিতা শেখরকে ভয়ও করত, আবার অদ্ভুতভাবে তার ওপর নির্ভরও করত।

শেখর কখনো তাকে বকত, কখনো সাহায্য করত। তাদের সম্পর্কের মধ্যে বন্ধুত্বের চেয়ে বেশি কিছু ছিল, কিন্তু কেউই সেই অনুভূতিকে স্পষ্ট করে নাম দেয়নি।

ললিতার বয়স বাড়ার সঙ্গে সঙ্গে শেখরের প্রতি তার টানও গভীর হতে লাগল।

একদিন শেখরের ঘরে বসে ললিতা স্বাভাবিকভাবেই তার কিছু জিনিস নিয়ে নাড়াচাড়া করছিল। শেখর তাকে দেখে বিরক্ত হওয়ার ভান করলেও মনে মনে তার এই উপস্থিতিটা উপভোগ করত।

কিন্তু গুরুচরণের সংসারে অর্থকষ্ট দিন দিন বাড়ছিল।

নাকি এতদিনের সম্পর্কটা শুধু অভ্যাস?

ঠিক সেই সময় শেখর এসে তার সামনে দাঁড়াল।

কিছুক্ষণ দুজনেই নীরব।

তারপর শেখর বলল,

—ললিতা, তুমি কি আমাকে বিশ্বাস কর?

ললিতা ধীরে মাথা তুলল।

—সবসময় করেছি।

শেখর বলল,

—তাহলে আমার একটা কথাও বিশ্বাস করবে?

—কী কথা?

শেখর উত্তর দিল না।

শুধু তার দিকে তাকিয়ে রইল।

সেই নীরবতায় দুজনেই বুঝে গেল—

তাদের সম্পর্কের নাম হয়তো কেউ দেয়নি, কিন্তু তাদের হৃদয়ে সেই সম্পর্ক অনেক আগেই তৈরি হয়ে গেছে।

তবে সামনে যে ঘটনা আসছিল, তা তাদের এই নীরব ভালোবাসাকে আরও বড় পরীক্ষার সামনে দাঁড় করাবে।

শেখর আর ললিতার সম্পর্ক তখন এমন এক জায়গায় এসে পৌঁছেছিল, যেখানে দুজনের মধ্যেই ভালোবাসা স্পষ্ট—শুধু মুখে স্বীকার করা বাকি।

কিন্তু ভুল বোঝাবুঝি তাদের সম্পর্ককে জটিল করে তুলল।

শেখর ললিতার সঙ্গে গিরীনের সম্পর্ক নিয়ে সন্দেহ করতে শুরু করল। অথচ গিরীন বুঝতে পেরেছিল, ললিতার মন অন্য একজনের জন্যই।

অন্যদিকে ললিতা মনে মনে কষ্ট পেলেও শেখরের কাছে নিজের ভালোবাসার দাবি করতে পারছিল না।

এরই মধ্যে শেখরের জীবনে এমন কিছু ঘটনা ঘটল, যার ফলে সে নিজের পুরোনো ধারণাগুলো নিয়ে নতুন করে ভাবতে বাধ্য হলো।

সে বুঝতে পারল—ললিতাকে সে কখনোই শুধু প্রতিবেশী বা পরিচিত একজন মেয়ে হিসেবে দেখেনি।

ললিতা তার জীবনের অবিচ্ছেদ্য অংশ হয়ে গেছে।

শেষ পর্যন্ত সত্য প্রকাশ পেল।

ললিতা ও শেখরের সম্পর্ক যে কেবল বন্ধুত্ব নয়, তাদের মধ্যে গভীর এক বন্ধন তৈরি হয়েছে—এ কথা আর গোপন রইল না।

শেখরের ভুল ধারণাও দূর হলো।

গিরীনও বুঝতে পারল, ললিতার হৃদয়ে তার জন্য সেই জায়গা নেই। তাই সে কোনো জোর না করে সরে দাঁড়াল।

সব বাধা পেরিয়ে শেখর ও ললিতার সম্পর্ক স্বীকৃতি পেল।

শেখর তখন বুঝতে পারল, এতদিন যে মানুষটিকে সে নিজের জীবনের স্বাভাবিক অংশ বলে ধরে নিয়েছিল, তাকে হারানোর ভয়ই তার ভালোবাসার সত্যিকারের পরিচয়।

ললিতার জীবনেও এল স্বস্তি।

যে সম্পর্কের কোনো নাম ছিল না, শেষ পর্যন্ত সেই সম্পর্কই পরিণতি পেল।

তাদের গল্পের সবচেয়ে বড় সৌন্দর্য ছিল—ভালোবাসা তাদের কাছে হঠাৎ আসেনি।

শৈশবের পরিচয়, অভ্যাস, অভিমান আর নীরব যত্নের মধ্য দিয়ে ভালোবাসা ধীরে ধীরে তাদের জীবনের অংশ হয়ে উঠেছিল।

আর শেষ পর্যন্ত সেই নীরব ভালোবাসাই হয়ে উঠল তাদের জীবনের সবচেয়ে সত্য সম্পর্ক।

একই গ্রামের পাশাপাশি দুটি বাড়িতে বড় হয়ে উঠেছিল দেবদাস আর পার্বতী—যাকে সবাই আদর করে পারু বলে ডাকত।

ছোটবেলা থেকেই তাদের মধ্যে ছিল গভীর বন্ধুত্ব। একসঙ্গে খেলাধুলা, ছোটখাটো ঝগড়া, আবার কিছুক্ষণ পরেই সব ভুলে যাওয়া—তাদের সম্পর্ক ছিল খুব স্বাভাবিক।

দেবদাস ছিল জমিদার পরিবারের ছেলে। তার মধ্যে ছিল কিছুটা অহংকার আর নিজের ইচ্ছামতো চলার অভ্যাস। পারু ছিল অন্যরকম—শান্ত, আত্মমর্যাদাবোধসম্পন্ন এবং দেবদাসের প্রতি গভীরভাবে টান অনুভব করত।

সময়ের সঙ্গে তারা বড় হতে লাগল।

শৈশবের সেই বন্ধুত্ব ধীরে ধীরে অন্য এক অনুভূতিতে বদলে গেল।

দেবদাস হয়তো তখনও নিজের মনের কথাটা পুরোপুরি বুঝতে পারেনি। কিন্তু পারু বুঝেছিল—দেবদাস তার কাছে আর শুধু ছোটবেলার বন্ধু নয়।

একসময় দেবদাসকে পড়াশোনার জন্য গ্রামের বাইরে পাঠানো হলো।

দেবদাস চলে যাওয়ার পর পারুর দিনগুলোও বদলে গেল। আগের মতো দেখা নেই, কথা নেই। তবু মনের মধ্যে দেবদাসের জন্য অপেক্ষা রয়ে গেল।

কয়েক বছর পর দেবদাস গ্রামে ফিরে এল।

পুরোনো বাড়ি, পুরোনো পথ, পুরোনো মানুষ—সবই যেন একই ছিল।

শুধু পারু আর আগের ছোট্ট মেয়েটি নেই।

দেবদাস যখন পারুকে দেখল, তখন তার মনে হলো—শৈশবের সেই পরিচিত মানুষটি হঠাৎ যেন নতুন করে তার সামনে এসে দাঁড়িয়েছে।

পারুও দেবদাসকে দেখে নিজের অনুভূতি লুকাতে পারল না।

কিন্তু তাদের সম্পর্কের সামনে তখন থেকেই দাঁড়িয়ে ছিল পরিবার, সামাজিক মর্যাদা এবং পারিবারিক অহংকারের কঠিন দেয়াল।

দুজনেই একে অপরকে ভালোবাসে—কিন্তু ভালোবাসার কথা মুখে বলা এত সহজ ছিল না।

পারু মনে মনে আশা করল, দেবদাস একদিন তাকে নিজের করে চাইবে।

আর দেবদাসও বুঝতে শুরু করল—

পারুকে ছাড়া তার জীবন কল্পনা করা যতটা সহজ ভেবেছিল, আসলে ততটা সহজ নয়।

কিন্তু তাদের ভালোবাসার সবচেয়ে কঠিন পরীক্ষা তখনও শুরু হয়নি। দেবদাস আর পারুর সম্পর্ক ধীরে ধীরে গভীর হতে লাগল। দুজনেই বুঝতে পারছিল, তাদের মধ্যে শুধু শৈশবের বন্ধুত্ব নেই।

পারুর মনে একটাই বিশ্বাস ছিল—দেবদাস একদিন তাকে নিজের করে নেবে।

কিন্তু দেবদাসের মনে ছিল দ্বিধা।

সে পারুকে ভালোবাসত, অথচ নিজের পরিবারের সামনে সেই ভালোবাসার কথা বলার সাহস তার ছিল না।

এক রাতে পারু সাহস করে দেবদাসের কাছে নিজের মনের কথা জানিয়ে দিল।

দেবদাসও বুঝতে পারল, এতদিন যেটাকে সে বন্ধুত্ব ভেবেছিল, সেটাই আসলে তার জীবনের সবচেয়ে গভীর অনুভূতি।

কিন্তু যখন বিয়ের প্রসঙ্গ উঠল, তখন দুই পরিবারের সামাজিক অবস্থান নিয়ে আপত্তি দেখা দিল।

পারুর পরিবার দেবদাসের পরিবারের কাছে বিয়ের প্রস্তাব পাঠাল। দেবদাসের পরিবার সেই প্রস্তাবকে সম্মানজনকভাবে গ্রহণ করল না।

দেবদাসের মনে তখন ভীষণ দ্বন্দ্ব।

সে পারুকে হারাতে চায় না, আবার পরিবারের বিরুদ্ধেও দাঁড়াতে পারছে না।

শেষ পর্যন্ত সে পারুকে স্পষ্ট কোনো প্রতিশ্রুতি না দিয়ে দূরে সরে গেল।

পারু কষ্ট পেল।

সে বুঝতে পারল—ভালোবাসা থাকলেও দেবদাস সিদ্ধান্ত নেওয়ার মতো সাহস দেখাতে পারছে না।

দেবদাস শহরে ফিরে গেল।

কিন্তু দূরে গিয়েও পারুকে ভুলতে পারল না।

তার মনে বারবার ফিরে আসতে লাগল শৈশবের সেই দিনগুলো, পারুর মুখ আর তাদের একসঙ্গে কাটানো মুহূর্তগুলো।

অন্যদিকে পারুর পরিবার তার জন্য অন্য বিয়ের কথা ভাবতে শুরু করল।

পারু জানত, তার জীবনের সবচেয়ে গুরুত্বপূর্ণ সিদ্ধান্তটি এখন তার নিজের হাতে নেই।

তবু শেষবারের মতো সে দেবদাসের কাছ থেকে একটি উত্তর আশা করেছিল।

সে অপেক্ষা করছিল—

দেবদাস কি ফিরে এসে তাকে নিজের করে নেওয়ার সাহস করবে?

নাকি তাদের ভালোবাসা শুধু স্মৃতি হয়ে থাকবে?

সেই প্রশ্নের উত্তরই তাদের জীবনের পরবর্তী অধ্যায় বদলে দিতে চলেছিল।

একসময় মহেন্দ্রের বিয়ের জন্য একটি মেয়ের কথা ওঠে। কিন্তু মহেন্দ্র বিয়েতে রাজি হয় না।

শেষ পর্যন্ত তার বিয়ে হয় আশালতার সঙ্গে।

একসময় মহেন্দ্রের সঙ্গে তার বিয়ের সম্ভাবনা তৈরি হলেও মহেন্দ্র তখন তাকে বিয়ে করতে রাজি হয়নি।

সেই ঘটনার স্মৃতি বিনোদিনীর মনে রয়ে গিয়েছিল।

অন্যদিকে আশালতার সঙ্গে বিনোদিনীর পরিচয় হয় এবং তাদের মধ্যে বন্ধুত্ব তৈরি হয়।

আশালতা সরল মনে বিনোদিনীকে বিশ্বাস করতে শুরু করে।

কিন্তু বিনোদিনীর মনে জমে থাকা অভিমান, একাকিত্ব আর নিজের জীবনের প্রতি ক্ষোভ ধীরে ধীরে তাকে অন্যভাবে ভাবতে বাধ্য করে।

মহেন্দ্র যখন বিনোদিনীর বুদ্ধি ও ব্যক্তিত্ব লক্ষ্য করতে শুরু করল, তখন পরিস্থিতি আরও জটিল হয়ে উঠল।

বিহারীও বিনোদিনীর প্রতি আকৃষ্ট হতে শুরু করল।

চারজন মানুষের সম্পর্কের মধ্যে তখন তৈরি হলো এক অদৃশ্য টানাপোড়েন—

মহেন্দ্র, আশালতা, বিনোদিনী এবং বিহারী।

আশালতা তখনও বুঝতে পারেনি, তার সবচেয়ে কাছের মানুষটির জীবনে এমন একটি সম্পর্কের শুরু হয়ে গেছে, যা একদিন তার পুরো সংসারকে বদলে দেবে।
আশালতা বিনোদিনীকে খুব আপন করে নিয়েছিল। নিজের অনেক কথা সে বিনোদিনীর সঙ্গে ভাগ করে নিত। মহেন্দ্রের প্রতি তার ভালোবাসার কথাও লুকাত না।

বিনোদিনী বাইরে থেকে বন্ধুর মতোই সব কথা শুনত। কিন্তু তার নিজের মনে ছিল অন্যরকম অনুভূতি। মহেন্দ্র একসময় তাকে বিয়ে করতে অস্বীকার করেছিল—সেই পুরোনো অপমান তার মনে পুরোপুরি মুছে যায়নি।

মহেন্দ্রও ধীরে ধীরে বিনোদিনীর প্রতি আকৃষ্ট হতে শুরু করল।

বিনোদিনীর বুদ্ধি, আত্মবিশ্বাস এবং কথাবার্তা তাকে মুগ্ধ করত। আশালতার সরলতার সঙ্গে বিনোদিনীর ব্যক্তিত্বের পার্থক্য মহেন্দ্রের মনে কৌতূহল তৈরি করল।

অন্যদিকে বিহারী বিনোদিনীর আচরণের মধ্যে লুকিয়ে থাকা কষ্ট বুঝতে পারত।

সে মহেন্দ্রকে সতর্ক করার চেষ্টা করল।

কিন্তু মহেন্দ্র বন্ধুর কথা গুরুত্ব দিল না।

আশালতা তখনও কিছু বুঝতে পারছিল না। সে বিনোদিনীকে বিশ্বাস করত এবং মনে করত, তার সবচেয়ে কাছের বান্ধবী কখনো তার ক্ষতি করতে পারে না।

এই সরল বিশ্বাসই ধীরে ধীরে সমস্যার কারণ হয়ে উঠল।

বিনোদিনীও নিজের মনের সঙ্গে লড়াই করছিল। একদিকে আশালতার প্রতি বন্ধুত্ব, অন্যদিকে মহেন্দ্রের প্রতি তৈরি হওয়া আকর্ষণ এবং বহুদিনের জমে থাকা অভিমান—সবকিছু মিলিয়ে তার মন অস্থির হয়ে উঠল।

মহেন্দ্রের আচরণও বদলাতে লাগল।

আশালতা বুঝতে শুরু করল, তার স্বামী আগের মতো নেই।

কিন্তু সে কারণটা বুঝতে পারছিল না।

একদিন সে বিনোদিনীকে বলল,

—তুমি কি মনে করো, মহেন্দ্র আমার ওপর রাগ করেছে?

বিনোদিনী কিছুক্ষণ চুপ থেকে বলল,

—সব সময় মানুষ যা বলে, তার কারণটা মুখে থাকে না।

আশালতা কথাটার অর্থ বুঝতে পারল না।

কিন্তু বিনোদিনী জানত—এই সম্পর্কের ভেতরে এমন কিছু জন্ম নিচ্ছে, যার পরিণতি ভালো নাও হতে পারে।

এরপর মহেন্দ্র ও বিনোদিনীর মধ্যে গোপন ঘনিষ্ঠতা বাড়তে লাগল।

বিহারী পরিস্থিতি দেখে আরও চিন্তিত হয়ে উঠল।

সে বুঝতে পারছিল, আশালতা সত্যিটা জানতে পারলে ভেঙে পড়বে।

আর বিনোদিনীও বুঝতে শুরু করেছিল—সে যে খেলায় পা দিয়েছে, সেখানে শুধু অন্যদের নয়, নিজের জীবনও বদলে যেতে পারে।

বন্ধুত্বের আড়ালে যে টানাপোড়েন শুরু হয়েছিল, তা এবার ধীরে ধীরে সবার সামনে প্রকাশ পাওয়ার পথে।
মহেন্দ্র ও বিনোদিনীর সম্পর্ক যত গভীর হতে থাকে, আশালতার জীবন ততটাই অশান্ত হয়ে ওঠে। ধীরে ধীরে সে বুঝতে পারে, যাকে সে সবচেয়ে বেশি বিশ্বাস করেছিল, সেই সম্পর্কের মধ্যেই তার দুঃখের কারণ লুকিয়ে আছে।

বিনোদিনীর মনেও তখন শান্তি নেই। মহেন্দ্রের প্রতি তার আকর্ষণ থাকলেও সে বুঝতে পারে, এই সম্পর্ক তাকে সত্যিকারের সুখ দিচ্ছে না। তার পুরোনো অভিমান আর একাকিত্ব তাকে এমন পথে নিয়ে গেছে, যেখান থেকে ফিরে আসা কঠিন।

বিহারী বরাবরই বিনোদিনীর প্রতি গভীর সম্মান ও মমতা অনুভব করত। কিন্তু সে মহেন্দ্রের মতো আবেগের বশে সিদ্ধান্ত নিতে চায়নি।

শেষ পর্যন্ত বিনোদিনী নিজের ভুল বুঝতে শুরু করে।

সে উপলব্ধি করে—অন্যের সংসারে অশান্তি সৃষ্টি করে নিজের পুরোনো অপমানের প্রতিশোধ নেওয়া যায়, কিন্তু তাতে নিজের মনও শান্ত হয় না।

মহেন্দ্রও বুঝতে পারে, আবেগের পেছনে ছুটতে গিয়ে সে আশালতার প্রতি অন্যায় করেছে।

আশালতা অনেক কষ্ট পেলেও ধীরে ধীরে নিজের আত্মসম্মান ফিরে পেতে শুরু করে।

বিনোদিনী শেষ পর্যন্ত সেই সংসার থেকে সরে যাওয়ার সিদ্ধান্ত নেয়। তার মনে থাকে অনেক অনুশোচনা, অনেক না-বলা কথা।

বিহারীর প্রতি তার যে অনুভূতি তৈরি হয়েছিল, সেটিও সহজ কোনো পরিণতি পায় না।

শেষ পর্যন্ত বিনোদিনী নিজের পথ বেছে নেয়।

মহেন্দ্র ফিরে যায় নিজের জীবনের বাস্তবতার দিকে।

আশালতাও বুঝতে শেখে, ভালোবাসা শুধু কাউকে আঁকড়ে ধরে থাকার নাম নয়—নিজের মর্যাদা ও আত্মপরিচয় ধরে রাখাও ভালোবাসার অংশ।

চারজন মানুষের এই সম্পর্কের গল্পে কেউ পুরোপুরি জয়ী হয় না, কেউ পুরোপুরি পরাজিতও হয় না।

তারা প্রত্যেকে নিজেদের ভুল, আকাঙ্ক্ষা আর অভিজ্ঞতা থেকে কিছু শিখে যায়।

“চোখের বালি” তাই শুধু প্রেমের গল্প নয়—এটি মানুষের মন, ঈর্ষা, আকাঙ্ক্ষা, বন্ধুত্ব এবং ভুল সিদ্ধান্তের গল্প।

শেষে বিনোদিনী চলে যায়, কিন্তু তার রেখে যাওয়া স্মৃতি থেকে যায় মহেন্দ্র, আশালতা ও বিহারীর জীবনে।

আর তাদের জীবনের সেই অধ্যায় চিরদিনের জন্য হয়ে থাকে—

একটি অসমাপ্ত সম্পর্কের স্মৃতি।

**ashraful🍂**

—যদি ভালোবাসাটা সত্যি হয়, তাহলে মানুষ চলে গেলেও ভালোবাসাটা থেকে যেতে পারে।

মেহরিন মৃদু হেসে বলল,

—তাহলে আমাকে একটা প্রতিশ্রুতি দাও।

—কী?

মেহরিন ধীরে বলল,

—যদি কোনোদিন আমি তোমার জীবন থেকে হারিয়ে যাই, আমাকে ভুলে যেও না।

সায়ন তার দিকে তাকিয়ে বলল,

—তুমি হারিয়ে গেলেও আমি তোমাকে খুঁজব।

মেহরিন কিছু বলল না।

শুধু চোখ নামিয়ে নিল।

সে জানত না, কয়েক মাস পর সত্যিই তাকে সায়নের জীবন থেকে হারিয়ে যেতে হবে।

আর সায়ন তখন বুঝবে—

“আমৃত্যু ভালোবাসি তোকে” শুধু একটা প্রতিশ্রুতি নয়, কখনো কখনো এটা হয়ে ওঠে সারাজীবনের অপেক্ষা।
মেহরিনের সঙ্গে পরিচয়ের পর সায়নের দিনগুলো বদলে গেল।

আগে যেসব দিন খুব সাধারণ মনে হতো, এখন সেসব দিনের মধ্যেই সে মেহরিনকে খুঁজে পেত।

সকালে ঘুম থেকে উঠে প্রথমে ফোনটা দেখত।

মেহরিনের কোনো মেসেজ এসেছে কি না।

একদিন মেহরিন লিখল—

“আজ আমাকে মনে পড়েছে?”

সায়ন উত্তর দিল—

“আজ না। প্রতিদিন।”

মেহরিন কিছুক্ষণ পর লিখল—

“মিথ্যাবাদী।”

সায়ন বলল—

“তুমি চাইলে প্রমাণ দিতে পারি।”

—“কীভাবে?”

—“আজ সারাদিন তোমার সঙ্গে কথা বলে।”

মেহরিন হেসে ফেলল।

এভাবেই তাদের সম্পর্ক আরও গভীর হতে লাগল।

একদিন সায়ন সাহস করে বলল,

—মেহরিন, তোমাকে একটা কথা বলব?

—বলো।

—তুমি আমার কাছে শুধু বন্ধু নও।

মেহরিন চুপ করে রইল।

সায়ন আবার বলল,

—তোমাকে দেখলে আমার ভালো লাগে। তোমার সঙ্গে কথা না বললে খারাপ লাগে। তুমি মন খারাপ করলে আমারও মন খারাপ হয়।

মেহরিন আস্তে করে বলল,

—তার মানে?

সায়ন সরাসরি বলল,

—আমি তোমাকে ভালোবাসি।

মেহরিন অনেকক্ষণ কোনো কথা বলল না।

তারপর মৃদু গলায় বলল,

—আমি জানতাম।

—জানতে?

—তোমার চোখ অনেক আগেই বলে দিয়েছে।

সায়ন হেসে বলল,

—তাহলে এতদিন বলোনি কেন?

মেহরিন বলল,

—ভয় পেয়েছিলাম।

—কিসের?

—তোমাকে হারানোর।

সায়ন বলল,

—ভালোবাসলে হারানোর ভয় থাকে। কিন্তু না বললে পাওয়ার সুযোগও থাকে না।

মেহরিন ধীরে বলল,

—তাহলে আমিও বলি।

—কী?

—আমিও তোমাকে ভালোবাসি।

সায়নের মুখে হাসি ফুটে উঠল।

সেদিন দুজনেই মনে করেছিল, তাদের গল্পটা বুঝি সহজেই সুন্দরভাবে এগিয়ে যাবে।

কিন্তু কিছু সুখের গল্পের মাঝেও হঠাৎ এমন একটা খবর আসে, যা সবকিছু বদলে দেয়।

কয়েকদিন পর মেহরিন সায়নকে দেখা করতে বলল।

তার চোখে ছিল অদ্ভুত বিষণ্ণতা।

সায়ন জিজ্ঞেস করল,

—কী হয়েছে?

মেহরিন অনেকক্ষণ চুপ থেকে বলল,

—আমাকে কিছুদিনের জন্য এই শহর ছেড়ে যেতে হবে।

সায়নের মুখের হাসি মিলিয়ে গেল।

—কোথায়?

—অনেক দূরে।

—কতদিনের জন্য?

মেহরিন চোখ নামিয়ে বলল,

—জানি না।

সায়ন তার হাতের মুঠো শক্ত করে ধরে বলল,

—তুমি ফিরে আসবে তো?

মেহরিন কোনো উত্তর দিল না।

শুধু বলল,

—আমাকে একটা কথা প্রতিশ্রুতি দাও।

—কী?

—যতদিন আমি ফিরছি না, ততদিন আমাকে ভুলে যেও না।

সায়ন বলল,

—আমি অপেক্ষা করব।

মেহরিন চোখের পানি মুছে মৃদু হাসল।

—তাহলে আমিও ফিরব।

কিন্তু সায়ন জানত না—

মেহরিনের চলে যাওয়ার কারণটা শুধু দূরে যাওয়া নয়।

তার জীবনে এমন একটি সত্য লুকিয়ে ছিল, যা সায়ন জানতে পারলে হয়তো তাকে আর কখনো ক্ষমা করতে পারবে না।

আর সেই সত্যটাই তাদের ভালোবাসার সবচেয়ে বড় পরীক্ষা হতে চলেছিল।
মেহরিন চলে যাওয়ার পর ছয় মাস কেটে গেল।

সায়ন প্রতিদিন অপেক্ষা করত। প্রতিদিন একই প্রশ্ন করত নিজেকে—

“মেহরিন কি সত্যিই ফিরে আসবে?”

কোনো উত্তর আসত না।

এক রাতে তার ফোনে হঠাৎ একটি মেসেজ এল।

“কাল তোমার সঙ্গে দেখা করতে চাই।”

প্রেরকের নাম দেখে সায়নের বুকটা কেঁপে উঠল।

মেহরিন।

পরদিন তারা দেখা করল।

মেহরিন আগের চেয়ে অনেক শান্ত হয়ে গেছে।

সায়ন প্রথমেই জিজ্ঞেস করল,

—এতদিন কোথায় ছিলে?

মেহরিন নিচু গলায় বলল,

—আমার পরিবার চেয়েছিল আমি তোমার জীবন থেকে সরে যাই। তারা ভেবেছিল, আমার অতীত তোমার ভবিষ্যৎ নষ্ট করবে।

সায়ন বলল,

—তুমি কি তাদের কথা বিশ্বাস করেছিলে?

—না। কিন্তু তোমাকে বিপদে ফেলতে চাইনি।

সায়ন কিছুক্ষণ চুপ করে থেকে বলল,

—তুমি চলে যাওয়ার আগে শুধু একবার আমাকে সত্যিটা বলতে পারতে।

মেহরিনের চোখে পানি চলে এল।

—ভয় পেয়েছিলাম। ভেবেছিলাম তুমি আমাকে ছেড়ে চলে যাবে।

সায়ন ধীরে বলল,

—তুমি যদি সত্যি বলতেই, তাহলে অন্তত সিদ্ধান্তটা আমার হতে পারত।

মেহরিন মাথা নিচু করল।

—আমাকে ক্ষমা করবে?

সায়ন তার দিকে তাকিয়ে বলল,

—তোমার ওপর রাগ করেছি। অনেক কষ্টও পেয়েছি। কিন্তু তোমাকে ভালোবাসা বন্ধ করতে পারিনি।

মেহরিন চোখের পানি মুছে বলল,

—তাহলে এতদিন অপেক্ষা করলে কেন?

সায়ন মৃদু হেসে বলল,

—কারণ আমি তোমাকে কথা দিয়েছিলাম।

মেহরিন আস্তে বলল,

—কোন কথা?

সায়ন উত্তর দিল,

—তুমি হারিয়ে গেলেও তোমাকে খুঁজব।

দুজনেই কিছুক্ষণ নীরবে দাঁড়িয়ে রইল।

মেহরিন বলল,

—আমি এবার কোথাও যাচ্ছি না।

সায়ন বলল,

—সত্যি?

—হ্যাঁ।

—তাহলে একটা কথা আমিও বলব।

—কী?

সায়ন মৃদু হেসে বলল,

—তোমাকে প্রথম দিন থেকেই ভালো লেগেছিল। পরে ভালোবেসেছি। আর এখন বুঝেছি, ভালোবাসা শুধু কাউকে কাছে পাওয়ার নাম নয়—তার পাশে থাকার সিদ্ধান্তও।

মেহরিন তার দিকে তাকিয়ে হাসল।

—তাহলে এবার আমাকে আর হারাতে দেবে না?

—না।

—কেন?

—কারণ তুমি আমার অপেক্ষার শেষ।

মেহরিন হেসে বলল,

—আর তুমি?

সায়ন বলল,

—আমি তোমার গল্পের শেষ নয়।

—তাহলে?

—আমি তোমার সঙ্গে বাকি গল্পটা লিখতে চাই।

সেদিন তাদের জীবনের দীর্ঘ অপেক্ষার অবসান হলো।

কেউ জানত না ভবিষ্যতে কী আছে।

তবু দুজনেই জানত—

ভালোবাসা যদি সত্যি হয়, তাহলে পথ যত কঠিনই হোক, দুজন মানুষ একসঙ্গে থাকার সিদ্ধান্ত নিলে গল্পের শেষটা বদলে যায়।

আর সায়নের শেষ কথাটা মেহরিন কোনোদিন ভুলেনি—

“তোকে ভালোবেসেছি আজ নয়, শুধু কালও নয়—তুই যতদিন আমার জীবনে থাকবি, ততদিন তোকে ভালোবাসব।”

**🍂ashraful🍂**

পুরোনো বাড়িটার ঘর পরিষ্কার করতে গিয়ে নীল একটা বাক্স পেল রাফি। বাক্সটার ওপর ধুলো জমে ছিল, তবু তালাটা অদ্ভুতভাবে খোলা।
ভেতরে ছিল কিছু পুরোনো ছবি, শুকিয়ে যাওয়া ফুল আর একটা কালো মলাটের ডায়েরি।
ডায়েরির প্রথম পাতায় শুধু একটা নাম লেখা—
“মায়া”
রাফি নামটা আগে কখনো শোনেনি।
কৌতূহলবশত ডায়েরিটা খুলল।
প্রথম কয়েক পৃষ্ঠা ছিল সাধারণ দিনের কথা। তারপর একটা পাতায় এসে তার চোখ আটকে গেল।
সেখানে লেখা—
“আজ তাকে প্রথম দেখলাম। জানি না তার নাম কী। কিন্তু কেন যেন মনে হচ্ছে, এই মানুষটাকে আমার জীবনে আবার দেখা হবে।”
রাফি একটু অবাক হলো।
পরের পাতায়—
“আজ তার নাম জানলাম—আরমান। সে জানে না, প্রতিদিন দূর থেকে তাকে দেখার অভ্যাসটা আমার কতটা প্রিয় হয়ে গেছে।”
রাফি পড়তে পড়তে বুঝতে পারল, মায়া নামের মেয়েটি আরমানকে ভালোবাসত।
কিন্তু গল্পটা সুখের ছিল না।
একদিনের পাতায় লেখা—
“আরমান আজ আমাকে জিজ্ঞেস করল, আমি কি তাকে ভালোবাসি। আমি উত্তর দিতে পারিনি। কারণ আমি জানি, আমার হাতে সময় খুব কম।”
রাফির বুকটা কেঁপে উঠল।
তারপরের কয়েকটি পৃষ্ঠা ছেঁড়া।
শেষের দিকে এসে ডায়েরিতে আবার লেখা শুরু হয়েছে।
“যদি কেউ কোনোদিন এই ডায়েরি পড়ে, তাকে একটা অনুরোধ—শেষ পৃষ্ঠাটা পড়ার আগে আরমানকে খুঁজে বের করো।”
রাফি থমকে গেল।
আরও নিচে একটা ঠিকানা লেখা।
ঠিকানাটা তার নিজের শহরের।
কিন্তু তার চেয়েও অদ্ভুত বিষয় ছিল—
ঠিকানার নিচে লেখা ছিল,
“আরমান এখনও জানে না, আমি তাকে কেন ছেড়ে চলে গিয়েছিলাম।”
রাফি ডায়েরিটা বন্ধ করে ফেলল।
কে ছিল মায়া?
কেন সে আরমানকে ছেড়ে চলে গিয়েছিল?
আর সবচেয়ে বড় প্রশ্ন—
ডায়েরির শেষ পৃষ্ঠায় কী লেখা আছে?
রাফি জানত না, এই ডায়েরি পড়তে শুরু করার সঙ্গে সঙ্গে সে এমন এক পুরোনো ভালোবাসার গল্পের মধ্যে ঢুকে পড়েছে, যার শেষটা এখনও লেখা হয়নি।
রাফি সারারাত ডায়েরিটার কথা ভাবল।
সকালে ঘুম থেকে উঠেই সে ডায়েরিতে লেখা ঠিকানাটা নিয়ে বেরিয়ে পড়ল।
ঠিকানাটা শহরের পুরোনো এক মহল্লায়।
অনেক খোঁজার পর সে একটা ছোট্ট বাড়ির সামনে এসে দাঁড়াল।
দরজায় বৃদ্ধ একজন মানুষ বসে ছিলেন।
রাফি জিজ্ঞেস করল,
—চাচা, এখানে কি আরমান নামে কেউ থাকেন?
বৃদ্ধ লোকটা কিছুক্ষণ রাফির দিকে তাকিয়ে রইলেন।
তারপর ধীরে বললেন,
—তুমি আরমানকে কেন খুঁজছ?
রাফি ব্যাগ থেকে ডায়েরিটা বের করল।
ডায়েরিটা দেখেই বৃদ্ধের মুখের ভাব বদলে গেল।
—এটা তুমি কোথায় পেলে?
—পুরোনো একটা বাড়ির বাক্সে।
বৃদ্ধ দীর্ঘশ্বাস ফেলে বললেন,
—আমি ভেবেছিলাম, এই ডায়েরি আর কোনোদিন কারও হাতে আসবে না।
রাফি অবাক হয়ে বলল,
—আপনি মায়াকে চিনতেন?
বৃদ্ধ কিছুক্ষণ চুপ করে থেকে বললেন,
—মায়া আমার মেয়ে।
রাফি যেন হঠাৎ কোনো উত্তর খুঁজে পেল না।
—তাহলে আরমান কোথায়?
বৃদ্ধ জানালেন,
—আরমান বহু বছর আগে এই শহর ছেড়ে চলে গেছে। কিন্তু যাওয়ার আগে সে প্রতিদিন এই বাড়ির সামনে এসে দাঁড়িয়ে থাকত।
—কেন?
—মায়ার অপেক্ষায়।
রাফি ডায়েরির একটা পৃষ্ঠা খুলে দেখাল।
—এখানে লেখা আছে, মায়া কেন তাকে ছেড়ে গিয়েছিল সেটা আরমান জানত না।
বৃদ্ধের চোখে পানি জমে উঠল।
—আরমান সত্যিটা কখনো জানতে পারেনি।
রাফি ধীরে জিজ্ঞেস করল,
—সত্যিটা কী?
বৃদ্ধ কোনো উত্তর দিলেন না।
শুধু বললেন,
—ডায়েরির শেষের আগের পাতাটা পড়ো।
রাফি তাড়াতাড়ি ডায়েরি খুলল।
পাতায় লেখা—
“আরমান, তুমি যদি কোনোদিন জানতে পারো আমি কেন চলে গিয়েছিলাম, তাহলে আমাকে ঘৃণা কোরো না। আমি তোমাকে ছেড়ে যাইনি। তোমাকে বাঁচানোর জন্য দূরে গিয়েছিলাম।”
রাফির চোখ আটকে গেল শেষ লাইনে।
তার নিচে লেখা ছিল—
“কিন্তু আমার চলে যাওয়ার আসল কারণটা শুধু একজন মানুষ জানে।”
রাফি মাথা তুলে বৃদ্ধের দিকে তাকাল।
—সেই মানুষটা কে?
বৃদ্ধ এবার ধীরে ধীরে বললেন,
—আমি।
ঘরের ভেতর হঠাৎ নীরবতা নেমে এল।
রাফি বুঝতে পারল, মায়ার গল্পের সবচেয়ে গুরুত্বপূর্ণ সত্যটা এখনও তার কাছ থেকে লুকিয়ে রাখা হয়েছে।
আর ডায়েরির শেষ পৃষ্ঠা খুলতে গেলে তাকে আগে জানতে হবে—
মায়া কেন আরমানকে ছেড়ে যেতে বাধ্য হয়েছিল।
বৃদ্ধ লোকটি অনেকক্ষণ চুপ করে থাকার পর ধীরে ধীরে বলতে শুরু করলেন।
—মায়া আর আরমান একে অপরকে সত্যিই ভালোবাসত। কিন্তু তখন আমাদের পরিবারে অনেক সমস্যা চলছিল। আমি চাইনি মায়ার কারণে আরমানও সেই সমস্যার মধ্যে জড়িয়ে পড়ুক।
রাফি জিজ্ঞেস করল,
—তাই মায়াকে চলে যেতে বলেছিলেন?
বৃদ্ধ মাথা নিচু করলেন।
—হ্যাঁ। কিন্তু মায়া আরমানকে সত্যিটা বলতে চেয়েছিল। আমি তাকে বাধা দিয়েছিলাম।
—তারপর?
—মায়া চলে গেল। যাওয়ার আগে এই ডায়েরিটা আমার কাছে রেখে বলেছিল, “যেদিন আরমান সত্যিটা জানার মতো প্রস্তুত হবে, সেদিন তাকে শেষ পৃষ্ঠাটা দিও।”
রাফি ডায়েরির শেষ পাতাটা খুলল।
পাতায় কাঁপা হাতে লেখা কয়েকটি লাইন—
“আরমান,
তুমি যদি এই চিঠি পড়ো, তাহলে বুঝব আমি আর তোমার সামনে দাঁড়িয়ে নিজের কথাগুলো বলতে পারিনি।
আমি তোমাকে ছেড়ে যেতে চাইনি। আমি শুধু চেয়েছিলাম, তুমি তোমার জীবনটা সুন্দরভাবে গড়ে তোলো।
তুমি হয়তো ভেবেছ, আমি তোমাকে ভুলে গেছি। কিন্তু সত্যিটা হলো—তোমাকে ভুলে থাকার চেষ্টা করেও আমি কোনোদিন তোমাকে ভুলতে পারিনি।
তুমি আমার জীবনের সবচেয়ে সুন্দর স্মৃতি ছিলে।
যদি কোনোদিন আমার কথা মনে পড়ে, আমাকে অভিমান করে মনে কোরো না। হাসিমুখে মনে কোরো।
কারণ আমি চাই, তোমার স্মৃতিতে আমাদের ভালোবাসার শেষটা কষ্টের না হয়ে সুন্দর হোক।”
চিঠির একেবারে নিচে লেখা ছিল—
“ভালোবাসার গল্প সবসময় একসঙ্গে থেকে শেষ হয় না। কখনো কখনো একজন মানুষ দূরে চলে গিয়েও অন্যজনের হৃদয়ে থেকে যায়।”
রাফি চুপ করে ডায়েরিটা বন্ধ করল।
বৃদ্ধ জানালেন, আরমান বহু বছর ধরে অন্য শহরে থাকেন। মায়ার সঙ্গে তার আর কখনো দেখা হয়নি।
রাফি ডায়েরিটা বৃদ্ধের হাতে ফিরিয়ে দিল।
কিন্তু বৃদ্ধ বললেন,
—এটা তুমি রাখো।
—আমি?
—হ্যাঁ। হয়তো মায়া চেয়েছিল, শেষ পর্যন্ত এই গল্পটা এমন কারও হাতে পৌঁছাক, যে এর মূল্য বুঝবে।
রাফি ডায়েরিটা বুকের কাছে ধরে রাখল।
বাইরে তখন বৃষ্টি শুরু হয়েছে।
সে দরজার কাছে দাঁড়িয়ে শেষবারের মতো ডায়েরির প্রচ্ছদের দিকে তাকাল।
“ডায়েরির শেষ পৃষ্ঠা।”
শেষ পৃষ্ঠা সত্যিই শেষ হয়ে গিয়েছিল।
কিন্তু রাফির মনে হলো—
কিছু গল্পের শেষ পৃষ্ঠা থাকলেও, গল্পটা আসলে শেষ হয় না।
কারণ ভালোবাসা কখনো কখনো মানুষের জীবন থেকে চলে যায়, কিন্তু স্মৃতি হয়ে থেকে যায় বহু বছর।
আর সেই পুরোনো ডায়েরির শেষ পাতায় লেখা কথাগুলো রাফির মনে চিরদিনের জন্য থেকে গেল—
“শেষ পৃষ্ঠা শেষ হতে পারে,
কিন্তু সত্যিকারের ভালোবাসার গল্প কখনো শেষ হয় না।”

    <!-- JavaScript (এখানে আর হাত দেওয়ার প্রয়োজন নেই) -->
    <script>
        function readStory(id) {
            const titleElem = document.getElementById(`story-title-${id}`);
            const contentElem = document.getElementById(`story-${id}`);
            
            if (!contentElem) {
                alert("গল্পটি পাওয়া যায়নি!");
                return;
            }

            document.getElementById('welcome-area').classList.add('hidden');
            document.getElementById('list-area').classList.add('hidden');
            
            const viewer = document.getElementById('viewer-area');
            viewer.classList.remove('hidden');
            
            document.getElementById('st-title').innerText = titleElem ? titleElem.innerHTML.trim() : "";
            document.getElementById('st-content').innerText = contentElem.innerHTML.trim();
            
            document.getElementById('backBtn').style.display = 'flex';
            window.scrollTo(0,0);
        }

        function goBack() {
            document.getElementById('welcome-area').classList.remove('hidden');
            document.getElementById('list-area').classList.remove('hidden');
            document.getElementById('viewer-area').classList.add('hidden');
            document.getElementById('backBtn').style.display = 'none';
            window.scrollTo(0,0);
        }

        // সিকিউরিটি
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && ['c', 'u', 's', 'a', 'i'].includes(e.key.toLowerCase())) {
                e.preventDefault();
            }
            if (e.key === 'F12') {
                e.preventDefault();
            }
        });
    </script>
